name: Build Noad

on:
  push:
    branches: [Noad]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      LIBS_CACHE_VERSION: "v1"
      LIBS_REPO: 8099bb4X21/tdesktop-libs

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %GITHUB_WORKSPACE%\TBuild\Libraries
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          cp CACHE_KEY.txt LIBS_CACHE_KEY.txt
          for dir in ffmpeg openssl3 libvpx; do
            SUBMODULE_DIR="$TBUILD/$REPO_NAME/Telegram/ThirdParty/$dir"
            if [ -d "$SUBMODULE_DIR" ]; then
              git -C "$SUBMODULE_DIR" rev-parse HEAD >> LIBS_CACHE_KEY.txt 2>/dev/null || true
            fi
          done
          grep -A3 "stage('tg_angle'" "$TBUILD/$REPO_NAME/$PREPARE_PATH" | grep "git checkout" | awk '{print $3}' >> LIBS_CACHE_KEY.txt
          echo "LIBS_CACHE_KEY=$(sha256sum LIBS_CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Configure Pagefile.
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "D:"

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-${{ env.LIBS_CACHE_VERSION }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Download prebuilt libraries from Release.
        id: download-libs
        shell: bash
        run: |
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          for lib in ffmpeg openssl3 libvpx tg_angle; do
            TAG="${lib}-win-x64-${{ env.LIBS_CACHE_KEY }}"
            if gh release view "$TAG" --repo ${{ env.LIBS_REPO }} &>/dev/null; then
              echo "Downloading $TAG..."
              mkdir -p "$TEMP_DIR/libs-release"
              gh release download "$TAG" --repo ${{ env.LIBS_REPO }} --pattern "*.tar.zst" --dir "$TEMP_DIR/libs-release/"
              LIBS_DIR="$(cygpath -u "$LibrariesPath")"
              mkdir -p "$LIBS_DIR"
              tar --zstd -xf "$TEMP_DIR/libs-release/${lib}.tar.zst" -C "$(dirname "$LIBS_DIR")"
              echo "${lib}=hit" >> $GITHUB_OUTPUT
            else
              echo "${lib}=miss" >> $GITHUB_OUTPUT
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.LIBS_REPO_TOKEN }}

      - name: Show disk space before Libraries.
        shell: pwsh
        run: Get-PSDrive C,D | Format-Table Name, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Show disk space after Libraries.
        shell: pwsh
        run: Get-PSDrive C,D | Format-Table Name, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}

      - name: Free up some disk space.
        shell: bash
        run:           find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      - name: Upload rebuilt libraries to Release.
        shell: bash
        run: |
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          for lib in ffmpeg openssl3 libvpx tg_angle; do
            LIBS_DIR="$(cygpath -u "$LibrariesPath")"
            STAGE_KEY=$(cat "$LIBS_DIR/cache_keys/$lib" 2>/dev/null || true)
            if [ -z "$STAGE_KEY" ]; then continue; fi

            TAG="${lib}-win-x64-${{ env.LIBS_CACHE_KEY }}"

            if gh release view "$TAG" --repo ${{ env.LIBS_REPO }} --json body --jq '.body' 2>/dev/null | grep -qF "stage_key: $STAGE_KEY"; then
              echo "Release $TAG is up to date"
              continue
            fi

            gh release delete "$TAG" --repo ${{ env.LIBS_REPO }} --yes 2>/dev/null || true

            cd "$(dirname "$LIBS_DIR")"
            if [ "$lib" = "libvpx" ]; then
              # libvpx: tg_owt references $USED_PREFIX (win64/local/), so
              # include the make-installed artifacts in the tarball.
              # (vpx.pc omitted: not needed by cmake and gets deleted by cleanup)
              tar --zstd -cf "$TEMP_DIR/${lib}.tar.zst" \
                win64/libvpx/ \
                win64/local/include/vpx/ \
                win64/local/lib/x64/ \
                win64/cache_keys/${lib}
            else
              tar --zstd -cf "$TEMP_DIR/${lib}.tar.zst" win64/${lib}/ win64/cache_keys/${lib}
            fi

            gh release create "$TAG" "$TEMP_DIR/${lib}.tar.zst" --repo ${{ env.LIBS_REPO }} --title "$TAG" --notes "stage_key: $STAGE_KEY"
            echo "Uploaded $TAG"
          done
        env:
          GH_TOKEN: ${{ secrets.LIBS_REPO_TOKEN }}

      - name: Clean up old library releases (keep last 5).
        shell: bash
        run: |
          for lib in ffmpeg openssl3 libvpx tg_angle; do
            gh release list --repo ${{ env.LIBS_REPO }} --json tagName,publishedAt \
              --jq "[.[] | select(.tagName | startswith(\"${lib}-\"))] | sort_by(.publishedAt) | reverse | .[5:][] | .tagName" \
              | while read old_tag; do
              if [ -n "$old_tag" ]; then
                gh release delete "$old_tag" --repo ${{ env.LIBS_REPO }} --yes
                echo "Deleted old release: $old_tag"
              fi
            done
          done
        env:
          GH_TOKEN: ${{ secrets.LIBS_REPO_TOKEN }}

      - name: Telegram Desktop build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat x64 ^
            -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} ^
            -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
            -D DESKTOP_APP_ENABLE_LTO=ON ^
            -D DESKTOP_APP_USE_PACKAGED_FONTS=ON ^
            -D DESKTOP_APP_LOTTIE_DISABLE_RECOLORING=ON

          set CL=/Zm1000 /wd4819
          cmake --build ..\out --config Release --target Telegram --parallel 1

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: Telegram-noad-x64
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out\Release\Telegram.exe
